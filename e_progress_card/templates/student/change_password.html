
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Change Password | E-Progress Card</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

<link rel="stylesheet" href="{{ url_for('static', filename='css/enhanced.css') }}">
</head>

<body class="student-portal-page">

{% include "_topbar.html" %}

<div class="student-layout">

    <aside class="student-sidebar">

        <div class="sidebar-brand">

            <div class="brand-icon">
                <i class="bi bi-mortarboard-fill"></i>
            </div>

            <div>
                <h5>E-PROGRESS</h5>
                <small>Student Portal</small>
            </div>

        </div>


        <nav class="sidebar-menu">

            <a href="{{ url_for('student_dashboard') }}">
                <i class="bi bi-grid-1x2-fill"></i>
                Dashboard
            </a>

            <a href="{{ url_for('student_profile') }}">
                <i class="bi bi-person-circle"></i>
                My Profile
            </a>

            <a href="{{ url_for('student_marks') }}">
                <i class="bi bi-journal-check"></i>
                My Marks
            </a>

            <a href="{{ url_for('student_results') }}">
                <i class="bi bi-bar-chart-fill"></i>
                My Results
            </a>

            <a
                href="{{ url_for('student_change_password') }}"
                class="active">

                <i class="bi bi-shield-lock-fill"></i>
                Change Password

            </a>

        </nav>


        <div class="sidebar-bottom">

            <a
                href="{{ url_for('logout') }}"
                class="logout-link">

                <i class="bi bi-box-arrow-right"></i>
                Logout

            </a>

        </div>

    </aside>


    <main class="student-main">

        <div class="student-page-heading"><h1>Change Password</h1><p>Keep your student account secure</p></div>


        <div class="container-fluid px-4 pb-5">

            <div class="student-password-card">

                <div class="password-heading">

                    <div class="password-icon">

                        <i class="bi bi-shield-lock-fill"></i>

                    </div>

                    <div>

                        <h4>
                            Update Password
                        </h4>

                        <p>
                            Enter your current password and choose
                            a new password.
                        </p>

                    </div>

                </div>


                <form method="POST">

                    <div class="mb-4">

                        <label class="form-label">
                            Current Password
                        </label>

                        <input
                            type="password"
                            name="current_password"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            New Password
                        </label>

                        <input
                            type="password"
                            name="new_password"
                            class="form-control"
                            minlength="6"
                            required>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            minlength="6"
                            required>

                    </div>


                    <div class="password-actions">

                        <a
                            href="{{ url_for('student_dashboard') }}"
                            class="btn btn-light border">

                            Cancel

                        </a>


                        <button
                            type="submit"
                            class="btn btn-primary">

                            <i class="bi bi-check-circle-fill"></i>

                            Change Password

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

</body>
</html>
