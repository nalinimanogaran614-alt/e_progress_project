<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} - E-Progress Card</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/enhanced.css') }}"><style>.admin-wrap{max-width:1200px;margin:30px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e3eaf2;border-radius:16px;padding:24px;box-shadow:0 10px 28px rgba(18,59,120,.07)}.side-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.side-links a{padding:8px 12px;border-radius:8px;background:#eef5fc;color:#123b78;text-decoration:none;font-weight:700;font-size:12px}.muted{color:#718096;font-size:12px}.table td,.table th{font-size:12px}.form-control,.form-select{font-size:13px;height:42px}</style></head><body class="admin-page">{% include "_topbar.html" %}<div class="admin-wrap"><div class="side-links"><a href="{{ url_for('admin_dashboard') }}">Dashboard</a><a href="{{ url_for('admin_academic_years') }}">Academic Years</a><a href="{{ url_for('admin_semester_setup') }}">Semester Setup</a><a href="{{ url_for('admin_faculty_assignments') }}">Faculty Assignments</a><a href="{{ url_for('faculty') }}">Faculty</a></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
